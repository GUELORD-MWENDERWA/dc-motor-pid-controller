[platformio]
default_envs = uno

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall
test_ignore = *

; Host-side unit tests for the PID library: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
